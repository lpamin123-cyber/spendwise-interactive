<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Smart Budgeting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SpendWise Dashboard</h1>
      <p>Take control of your personal finances</p>
    </header>

    <!-- Budget Setting Section -->
    <section class="card">
      <h2>Set Monthly Budget</h2>
      <form id="budget-form">
        <div class="form-group">
          <label for="budget-input">Total Budget ($):</label>
          <input type="number" id="budget-input" min="0" step="0.01" placeholder="e.g., 2000" required>
        </div>
        <button type="submit">Set Budget</button>
      </form>
    </section>

    <!-- Overview & Conditionals Display -->
    <section class="card overview">
      <h2>Budget Summary</h2>
      <p>Total Budget: <span id="display-budget">$0.00</span></p>
      <p>Total Spent: <span id="display-spent">$0.00</span></p>
      <p>Remaining: <span id="display-remaining">$0.00</span></p>
      <div id="status-message" class="status neutral">Enter budget and add expenses to see status.</div>
    </section>

    <!-- Add Expense Section -->
    <section class="card">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-title">Title:</label>
          <input type="text" id="expense-title" placeholder="e.g., Groceries" required>
        </div>
        <div class="form-group">
          <label for="expense-amount">Amount ($):</label>
          <input type="number" id="expense-amount" min="0.01" step="0.01" placeholder="e.g., 50.00" required>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <!-- Expense List -->
    <section class="card">
      <h2>Expense History</h2>
      <ul id="expense-list">
        <!-- Dynamic list items will be injected here via script.js -->
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
